name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream & Sync
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || git remote set-url upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream
          git checkout main
          if git merge upstream/main --no-edit; then
            echo "✅ Merge successful, pushing to origin..."
            git push origin main
          else
            echo "❌ Merge conflict detected. Manual intervention required."
            exit 1
          fi
